<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<div
		style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px">
		<div style="font-size: 18px; font-weight: 700; color: #0a2545">
			<i class="pi pi-book" style="margin-right: 8px; color: #15558a" />
			Lançamento de Notas
		</div>
		<div style="display: flex; gap: 8px">
			<p:selectOneMenu style="width:160px">
				<f:selectItem itemLabel="10ª Classe A" itemValue="10A" />
			</p:selectOneMenu>
			<p:selectOneMenu style="width:160px">
				<f:selectItem itemLabel="Matemática" itemValue="mat" />
			</p:selectOneMenu>
		</div>
	</div>

	<div
		style="background: white; border-radius: 16px; padding: 18px; border: 1px solid #e9eef3; margin-bottom: 16px">
		<div
			style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; text-align: center">
			<div>
				<span
					style="font-size: 10px; color: #7a8a9d; text-transform: uppercase">Média
					Turma</span><br />
				<b style="font-size: 20px; color: #0b2d50">13.4</b>
			</div>
			<div>
				<span
					style="font-size: 10px; color: #7a8a9d; text-transform: uppercase">Aprovados</span><br />
				<b style="font-size: 20px; color: #10b981">34/42</b>
			</div>
			<div>
				<span
					style="font-size: 10px; color: #7a8a9d; text-transform: uppercase">Reprovados</span><br />
				<b style="font-size: 20px; color: #ef4444">8</b>
			</div>
			<div>
				<span
					style="font-size: 10px; color: #7a8a9d; text-transform: uppercase">Maior
					Nota</span><br />
				<b style="font-size: 20px; color: #f59e0b">18.5</b>
			</div>
		</div>
	</div>

	<div
		style="background: white; border-radius: 16px; padding: 4px; border: 1px solid #e9eef3">
		<p:dataTable var="n"
			value="#{[
            {'aluno':'Ana Paula Massingue','t1':14,'t2':15,'t3':13,'media':14.0,'obs':'Aprovada'},
            {'aluno':'João Carlos Mabjaia','t1':10,'t2':11,'t3':12,'media':11.0,'obs':'Recuperação'},
            {'aluno':'Carlos Tembe','t1':16,'t2':17,'t3':18,'media':17.0,'obs':'Quadro Honra'},
            {'aluno':'Sonia Muianga','t1':9,'t2':8,'t3':10,'media':9.0,'obs':'Reprovada'}
        ]}"
			editable="true" editMode="cell" style="font-size:12px">
			<p:column headerText="Aluno" width="220">
				<b>#{n.aluno}</b>
			</p:column>
			<p:column headerText="T1" width="80" style="text-align:center">
				<p:cellEditor>
					<f:facet name="output">#{n.t1}</f:facet>
					<f:facet name="input">
						<p:inputText value="#{n.t1}" style="width:100%" />
					</f:facet>
				</p:cellEditor>
			</p:column>
			<p:column headerText="T2" width="80" style="text-align:center">
				<p:cellEditor>
					<f:facet name="output">#{n.t2}</f:facet>
					<f:facet name="input">
						<p:inputText value="#{n.t2}" />
					</f:facet>
				</p:cellEditor>
			</p:column>
			<p:column headerText="T3" width="80" style="text-align:center">#{n.t3}</p:column>
			<p:column headerText="Média" width="90" style="text-align:center">
				<b style="color:#{n.media &gt;= 10 ? '#10b981' : '#ef4444'}">#{n.media}</b>
			</p:column>
			<p:column headerText="Obs.">
				<p:tag value="#{n.obs}"
					severity="#{n.obs eq 'Aprovada' ? 'success' : n.obs eq 'Quadro Honra' ? 'info' : 'danger'}"
					style="font-size:10px" />
			</p:column>
		</p:dataTable>
		<div
			style="padding: 14px; display: flex; justify-content: flex-end; gap: 10px">
			<p:commandButton value="Cancelar"
				styleClass="ui-button-secondary ui-button-outlined" />
			<p:commandButton value="Salvar Notas" icon="pi pi-save"
				style="background:#0b2d50;border:none" />
		</div>
	</div>
</ui:composition>
