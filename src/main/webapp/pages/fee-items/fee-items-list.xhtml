<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<h:form id="formFeeItems">
		<p:growl id="growl" showDetail="true" />

		<div
			style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px">
			<div>
				<div style="font-size: 18px; font-weight: 700; color: #0b1f3a">Items
					de Pagamento</div>
				<div style="font-size: 12px; color: #64748b">#{loginBean.loggedSchool.name}
					• Ano #{loginBean.loggedAcademicYear.year} •
					#{feeItemsBean.items.size()} items</div>
			</div>
			<p:commandButton value="Novo Item" icon="pi pi-plus"
				style="border-radius:10px;background:#0a2540;border:none;height:38px"
				action="#{feeItemsBean.prepareNew}"
				update=":formFeeItems:dlgFeeItem"
				oncomplete="PF('dlgFeeItem').show()" />
		</div>

		<div
			style="background: white; border: 1px solid #e6eaf0; border-radius: 16px; padding: 8px">
			<p:dataTable id="table" value="#{feeItemsBean.items}" var="f"
				paginator="true" rows="10" paginatorPosition="bottom"
				emptyMessage="Nenhum item cadastrado para este ano" rowKey="#{f.id}"
				widgetVar="tblFeeItems" styleClass="compact-table"
				filteredValue="#{feeItemsBean.filteredItems}">

				<p:column headerText="ID" width="70" sortBy="#{f.id}"
					filterBy="#{f.id}" filterMatchMode="contains">
					<b>#{f.id}</b>
				</p:column>

				<p:column headerText="DESCRIÇÃO" sortBy="#{f.descricao}"
					filterBy="#{f.descricao}" filterMatchMode="contains">
					<div style="display: flex; align-items: center; gap: 8px">
						<i class="pi pi-tag" style="color: #3b82f6; font-size: 12px" /> <b>#{f.descricao}</b>
					</div>
				</p:column>

				<p:column headerText="VALOR" width="130" style="text-align:right"
					sortBy="#{f.valor}">
					<b style="color: #0a2540">#{f.valor} MT</b>
				</p:column>

				<p:column headerText="ACTIVO" width="90" style="text-align:center">
					<p:tag value="#{f.activo ? 'Sim' : 'Não'}"
						severity="#{f.activo ? 'success' : 'danger'}"
						style="font-size:11px" />
				</p:column>

				<p:column headerText="ULTIMA ACTUALIZAÇÃO" width="170"
					sortBy="#{f.updatedAt}">
					<span style="font-size: 12px">#{feeItemsBean.formatDate(f.updatedAt)}</span>
				</p:column>

				<p:column headerText="AÇÕES" width="110" style="text-align:center">
					<p:commandButton icon="pi pi-pencil"
						styleClass="ui-button-rounded ui-button-text"
						action="#{feeItemsBean.prepareEdit(f)}"
						update=":formFeeItems:dlgFeeItem"
						oncomplete="PF('dlgFeeItem').show()" />
					<p:commandButton icon="pi pi-trash"
						styleClass="ui-button-rounded ui-button-text ui-button-danger"
						action="#{feeItemsBean.prepareDelete(f)}"
						update=":formFeeItems:confirmDel"
						oncomplete="PF('confirmDel').show()" />
				</p:column>
			</p:dataTable>
		</div>

		<p:dialog widgetVar="dlgFeeItem" id="dlgFeeItem"
			header="#{feeItemsBean.editing ? 'Editar' : 'Novo'} Item"
			modal="true" width="480">
			<h:panelGroup rendered="#{feeItemsBean.item != null}">
				<h:panelGrid columns="1" style="width:100%" cellpadding="8">
					<h:outputText value="Descrição *"
						style="font-size:12px;font-weight:600" />
					<p:inputText value="#{feeItemsBean.item.descricao}"
						style="width:100%"
						placeholder="Ex: Inscricao, Matricula, Mensalidade 1a classe"
						required="true" />

					<h:outputText value="Valor (MT) *"
						style="font-size:12px;font-weight:600" />
					<p:inputNumber value="#{feeItemsBean.item.valor}" symbol=" MT"
						symbolPosition="s" decimalPlaces="2" style="width:100%"
						required="true" />

					<div
						style="background: #f5f7fb; border-radius: 8px; padding: 10px; font-size: 11px; color: #64748b">
						Escola: <b style="color: #0b1f3a">#{loginBean.loggedSchool.name}</b>
						| Ano: <b style="color: #0b1f3a">#{loginBean.loggedAcademicYear.year}</b>
					</div>

					<p:selectBooleanCheckbox value="#{feeItemsBean.item.activo}"
						itemLabel="Activo" />
				</h:panelGrid>
			</h:panelGroup>
			<f:facet name="footer">
				<p:commandButton value="Salvar" icon="pi pi-check"
					action="#{feeItemsBean.save}"
					update=":formFeeItems:table :formFeeItems:growl"
					oncomplete="if(!args.validationFailed) PF('dlgFeeItem').hide()"
					style="background:#0a2540;border-radius:10px" />
				<p:commandButton value="Cancelar" onclick="PF('dlgFeeItem').hide()"
					styleClass="ui-button-secondary ui-button-outlined"
					style="border-radius:10px" />
			</f:facet>
		</p:dialog>
		<p:confirmDialog widgetVar="confirmDel" id="confirmDel"
			header="Remover?"
			message="Remover item #{feeItemsBean.selected.descricao}?"
			severity="warn">
			<p:commandButton value="Sim" action="#{feeItemsBean.delete}"
				update=":formFeeItems:table :formFeeItems:growl"
				oncomplete="PF('confirmDel').hide()" styleClass="ui-button-danger"
				style="border-radius:10px" />
			<p:commandButton value="Não" onclick="PF('confirmDel').hide()"
				styleClass="ui-button-secondary" style="border-radius:10px" />
		</p:confirmDialog>

	</h:form>
</ui:composition>
