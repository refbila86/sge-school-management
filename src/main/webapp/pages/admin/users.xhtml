<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<div
		style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px">
		<div style="font-size: 18px; font-weight: 700; color: #0a2545">
			<i class="pi pi-cog" style="margin-right: 8px; color: #15558a" />
			Utilizadores do Sistema
		</div>
		<p:commandButton value="Novo Utilizador" icon="pi pi-plus"
			style="border-radius:10px;background:#0b2d50;border:none" />
	</div>

	<div
		style="background: white; border-radius: 16px; padding: 4px; border: 1px solid #e9eef3">
		<p:dataTable var="u"
			value="#{[
            {'user':'admin','nome':'Administrador Geral','perfil':'ADMIN','escola':'Todas','ativo':true},
            {'user':'manuel.silva','nome':'Manuel Silva','perfil':'PROFESSOR','escola':'Escola Central','ativo':true},
            {'user':'secretaria','nome':'Secretaria','perfil':'SECRETARIA','escola':'Escola Central','ativo':true},
            {'user':'enc.joao','nome':'João Encarregado','perfil':'ENCARREGADO','escola':'Escola Central','ativo':false}
        ]}"
			paginator="true" rows="10" style="font-size:12px">
			<p:column headerText="Username" width="130">
				<b>#{u.user}</b>
			</p:column>
			<p:column headerText="Nome">#{u.nome}</p:column>
			<p:column headerText="Perfil" width="120">
				<p:tag value="#{u.perfil}"
					severity="#{u.perfil eq 'ADMIN' ? 'danger' : u.perfil eq 'PROFESSOR' ? 'info' : 'success'}"
					style="font-size:10px" />
			</p:column>
			<p:column headerText="Escola" width="140">#{u.escola}</p:column>
			<p:column headerText="Ativo" width="80" style="text-align:center">
				<p:toggleSwitch value="#{u.ativo}" disabled="true" />
			</p:column>
			<p:column headerText="Ações" width="120">
				<p:commandButton icon="pi pi-key" title="Resetar Senha"
					styleClass="ui-button-rounded ui-button-text" />
				<p:commandButton icon="pi pi-pencil"
					styleClass="ui-button-rounded ui-button-text ui-button-secondary" />
			</p:column>
		</p:dataTable>
	</div>
</ui:composition>
