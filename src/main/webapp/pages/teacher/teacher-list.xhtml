<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<style>
.page-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 18px;
	flex-wrap: wrap;
	gap: 12px
}

.page-title {
	font-size: 19px;
	font-weight: 700;
	color: #0a2540
}

.filter-bar {
	background: white;
	border: 1px solid #e6eaf0;
	border-radius: 14px;
	padding: 12px;
	display: flex;
	gap: 10px;
	align-items: center;
	margin-bottom: 14px;
	flex-wrap: wrap
}

.compact-table .ui-datatable-data td {
	padding: 12px 8px !important;
	font-size: 13.5px !important;
	font-weight: 400;
	color: #1e293b
}

.compact-table .ui-datatable-thead th {
	padding: 12px 8px !important;
	font-size: 11px !important;
	font-weight: 700;
	color: #0a2540;
	text-transform: uppercase;
	letter-spacing: .3px;
	background: #f8fafc
}

.compact-table .ui-datatable-data tr {
	height: 54px
}
</style>

	<h:form id="formList">
		<p:growl id="growl" showDetail="true" />

		<div class="page-header">
			<div class="page-title">
				<i class="pi pi-users" style="margin-right: 8px; color: #2563eb" />Gestão
				de Professores
			</div>
			<div style="display: flex; gap: 8px">
				<p:commandButton value="Novo Professor" icon="pi pi-plus"
					style="border-radius:10px;background:#0a2540;border:none;font-size:13px"
					actionListener="#{teacherBean.cleanForm}"
					action="#{dashboardBean.navigate('teacher/teacher-include','professores')}"
					update=":contentPanel" />
				<p:commandButton icon="pi pi-refresh"
					styleClass="ui-button-secondary ui-button-outlined"
					style="border-radius:10px" action="#{teacherBean.loadTeachers}"
					update=":contentPanel" process="@this" />
			</div>
		</div>

		<div class="filter-bar">
			<p:inputText value="#{teacherBean.searchTerm}"
				placeholder="Nome, código, email..."
				style="width:300px;font-size:13px" />
			<p:commandButton icon="pi pi-search" value="Buscar"
				style="border-radius:10px;font-size:13px"
				action="#{teacherBean.search}" update=":contentPanel" />
			<p:commandButton value="Limpar"
				styleClass="ui-button-secondary ui-button-outlined"
				style="border-radius:10px;font-size:13px"
				action="#{teacherBean.loadTeachers}" update=":contentPanel"
				process="@this" />
			<span style="margin-left: auto; font-size: 13px; color: #64748b">Total:
				<b>#{empty teacherBean.teachers ? '0' :
					teacherBean.teachers.size()}</b>
			</span>
		</div>

		<div
			style="background: white; border: 1px solid #e6eaf0; border-radius: 16px; padding: 6px; overflow: hidden"
			class="compact-table">
			<p:dataTable value="#{teacherBean.teachers}" var="t" paginator="true"
				rows="8" paginatorPosition="bottom" stripedRows="true"
				emptyMessage="Nenhum professor cadastrado">

				<p:column headerText="PROFESSOR" width="300" sortBy="#{t.firstName}"
					filterBy="#{t.name}">
					<div style="display: flex; align-items: center; gap: 10px">
						<div
							style="width: 36px; height: 36px; border-radius: 10px; background: #0a2540; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">
							#{t.firstName.substring(0,1)}#{t.lastName.substring(0,1)}</div>
						<div>
							<b style="font-size: 14px; display: block; color: #0a2540">#{t.name}</b>
							<span style="font-size: 11px; color: #64748b">#{t.code}</span>
						</div>
					</div>
				</p:column>

				<p:column headerText="CONTACTO" width="200">
					<span style="font-size: 13px">#{t.phone}</span>
					<br />
					<span style="font-size: 11px; color: #64748b">#{t.email}</span>
				</p:column>

				<p:column headerText="UTILIZADOR" width="150">
					<h:panelGroup rendered="#{t.user != null}">
						<span style="font-size: 13px">#{t.user.username}</span>
						<br />
						<span style="font-size: 11px; color: #64748b">#{t.user.role}</span>
					</h:panelGroup>
					<h:panelGroup rendered="#{t.user == null}">
						<span style="font-size: 12px; color: #94a3b8; font-style: italic">Sem
							utilizador</span>
					</h:panelGroup>
				</p:column>

				<p:column headerText="ANO LETIVO" width="120"
					style="text-align:center">
					<span
						style="background: #eef2ff; color: #4338ca; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 11px">
						#{t.academicYear != null ? t.academicYear.year : 'N/D'} </span>
				</p:column>

				<p:column headerText="AÇÕES" width="110" style="text-align:center">
					<p:commandButton icon="pi pi-pencil"
						styleClass="ui-button-rounded ui-button-text ui-button-secondary"
						style="width:34px;height:34px" title="Editar"
						action="#{dashboardBean.navigate('teacher/teacher-include','professores')}"
						update=":contentPanel">
						<f:setPropertyActionListener value="#{t}"
							target="#{teacherBean.teacher}" />
						<f:setPropertyActionListener value="#{true}"
							target="#{teacherBean.editing}" />
					</p:commandButton>
					<p:commandButton icon="pi pi-trash"
						styleClass="ui-button-rounded ui-button-text ui-button-danger"
						style="width:34px;height:34px" title="Remover"
						action="#{teacherBean.delete(t)}" update=":contentPanel">
						<p:confirm header="Confirmar" message="Remover #{t.name}?"
							icon="pi pi-exclamation-triangle" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</div>

		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
			responsive="true" width="350">
			<p:commandButton value="Não" type="button"
				styleClass="ui-button-flat ui-button-secondary" />
			<p:commandButton value="Sim" type="button"
				styleClass="ui-button-danger" />
		</p:confirmDialog>
	</h:form>
</ui:composition>
