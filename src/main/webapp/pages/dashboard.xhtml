<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<h:head>
		<title>SGE - Sistema de Gestão Escolar</title>
		<h:outputStylesheet library="primefaces"
			name="primeicons/primeicons.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
			rel="stylesheet" />
	</h:head>

	<h:body
		style="margin:0;background:#f6f8fb;font-family:'Inter',sans-serif">
		<style>
:root {
	--primary: #0b1f3a;
	--accent: #3b82f6;
	--bg: #f5f7fb;
	--card: #fff;
	--border: #e6eaf0
}

* {
	box-sizing: border-box
}

.app {
	display: flex;
	min-height: 100vh
}

.sidebar {
	width: 278px;
	background: var(--primary);
	color: rgba(255, 255, 255, .85);
	display: flex;
	flex-direction: column;
	transition: width .25s ease;
	position: sticky;
	top: 0;
	height: 100vh;
	z-index: 30
}

.sidebar.collapsed {
	width: 74px
}

.sidebar.collapsed .brand-text, .sidebar.collapsed .menu-label, .sidebar.collapsed .menu-section-title,
	.sidebar.collapsed .menu-arrow, .sidebar.collapsed .menu-badge,
	.sidebar.collapsed .user-details, .sidebar.collapsed .logout-text {
	display: none !important
}

.brand {
	padding: 0 12px 0 16px;
	display: flex;
	align-items: center;
	gap: 12px;
	border-bottom: 1px solid rgba(255, 255, 255, .08);
	min-height: 64px
}

.brand-logo {
	width: 36px;
	height: 36px;
	background: #fff;
	border-radius: 8px;
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--primary);
	font-weight: 800
}

.collapse-btn {
	margin-left: auto;
	background: rgba(255, 255, 255, .08) !important;
	border: 1px solid rgba(255, 255, 255, .08) !important;
	color: #fff !important;
	width: 30px !important;
	height: 30px !important;
	border-radius: 8px !important
}

.sidebar.collapsed .brand {
	justify-content: center;
	padding: 0
}

.sidebar.collapsed .collapse-btn {
	margin: 0
}

.menu {
	flex: 1;
	overflow-y: auto;
	padding: 10px
}

.menu-section {
	margin: 18px 0 6px
}

.menu-section-title {
	font-size: 10px;
	letter-spacing: .8px;
	text-transform: uppercase;
	color: rgba(255, 255, 255, .35);
	font-weight: 700;
	padding: 0 10px 6px
}

.menu-item {
	width: 100%;
	display: flex;
	align-items: center;
	gap: 11px;
	padding: 9px 11px;
	border-radius: 8px;
	color: rgba(255, 255, 255, .6);
	font-size: 13px;
	font-weight: 500;
	background: transparent;
	border: none;
	border-left: 2px solid transparent;
	cursor: pointer;
	text-align: left;
	font-family: inherit;
	position: relative
}

.menu-item:hover {
	background: rgba(255, 255, 255, .06);
	color: #fff
}

.menu-item.active {
	background: rgba(59, 130, 246, .18);
	color: #fff;
	border-left-color: var(--accent)
}

.menu-item i {
	font-size: 15px;
	width: 20px;
	text-align: center
}

.menu-badge {
	margin-left: auto;
	background: rgba(255, 255, 255, .12);
	color: rgba(255, 255, 255, .85);
	font-size: 10px;
	font-weight: 700;
	padding: 3px 8px;
	border-radius: 20px;
	min-width: 22px;
	text-align: center
}

.menu-item.active .menu-badge {
	background: rgba(255, 255, 255, .22);
	color: #fff
}

.main {
	flex: 1;
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--bg)
}

.topbar {
	height: 64px;
	background: #fff;
	border-bottom: 1px solid var(--border);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 20px;
	position: sticky;
	top: 0;
	z-index: 10
}

.content-area {
	padding: 24px;
	flex: 1
}

.sidebar-footer {
	padding: 12px;
	border-top: 1px solid rgba(255, 255, 255, .08);
	display: flex;
	flex-direction: column;
	gap: 10px;
	margin-top: auto
}

.sidebar-user {
	display: flex;
	gap: 10px;
	align-items: center;
	padding: 8px;
	border-radius: 8px;
	background: rgba(255, 255, 255, .04)
}

.user-avatar {
	width: 34px;
	height: 34px;
	background: rgba(255, 255, 255, .12);
	color: #fff;
	border-radius: 8px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 700;
	font-size: 13px
}

.logout-btn {
	width: 100%;
	background: transparent !important;
	border: 1px solid rgba(255, 255, 255, .14) !important;
	color: rgba(255, 255, 255, .7) !important;
	border-radius: 8px !important;
	font-size: 12px !important;
	height: 36px !important
}
</style>

		<div class="app">
			<div
				class="sidebar #{dashboardBean.sidebarCollapsed ? 'collapsed' : ''}"
				id="sidebar">
				<div class="brand">
					<div class="brand-logo">S</div>
					<div class="brand-text">
						<b style="color: #fff; display: block; line-height: 1">SGE</b><span
							style="font-size: 10px; color: rgba(255, 255, 255, .5)">v2.0</span>
					</div>
					<p:commandButton id="collapseBtn" styleClass="collapse-btn"
						icon="pi #{dashboardBean.sidebarCollapsed ? 'pi-angle-right' : 'pi-angle-left'}"
						action="#{dashboardBean.toggleSidebar}" update="@none"
						oncomplete="toggleSidebarUI()" />
				</div>

				<h:form id="menuForm" style="display:contents">
					<div class="menu">
						<button type="button"
							class="menu-item #{dashboardBean.activeMenu eq 'dashboard' ? 'active' : ''}"
							onclick="PF('navDashboard').jq.click()">
							<i class="pi pi-home" /><span class="menu-label">Dashboard</span>
						</button>

						<div class="menu-section">
							<div class="menu-section-title">
								<span class="menu-label">Academico</span>
							</div>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'alunos' ? 'active' : ''}"
								onclick="PF('navAlunos').jq.click()">
								<i class="pi pi-users" /><span class="menu-label">Alunos</span><span
									class="menu-badge menu-label">1.2k</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'professores' ? 'active' : ''}"
								onclick="PF('navProf').jq.click()">
								<i class="pi pi-briefcase" /><span class="menu-label">Professores</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'turmas' ? 'active' : ''}"
								onclick="PF('navTurmas').jq.click()">
								<i class="pi pi-building" /><span class="menu-label">Turmas</span><span
									class="menu-badge menu-label">#{classroomBean.classrooms.size()}</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'classes' ? 'active' : ''}"
								onclick="PF('navClasses').jq.click()">
								<i class="pi pi-sitemap" /><span class="menu-label">Classes</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'disciplinas' ? 'active' : ''}"
								onclick="PF('navDisc').jq.click()">
								<i class="pi pi-book" /><span class="menu-label">Disciplinas</span>
							</button>
						</div>

						<div class="menu-section">
							<div class="menu-section-title">
								<span class="menu-label">Avaliação</span>
							</div>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'notas' ? 'active' : ''}"
								onclick="PF('navNotas').jq.click()">
								<i class="pi pi-pencil" /><span class="menu-label">Lançamento
									de Notas</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'pautas' ? 'active' : ''}"
								onclick="PF('navPautas').jq.click()">
								<i class="pi pi-file" /><span class="menu-label">Pautas</span>
							</button>
						</div>

						<div class="menu-section">
							<div class="menu-section-title">
								<span class="menu-label">Financeiro</span>
							</div>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'mensalidades' ? 'active' : ''}"
								onclick="PF('navMens').jq.click()">
								<i class="pi pi-wallet" /><span class="menu-label">Mensalidades</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'pagamentos' ? 'active' : ''}"
								onclick="PF('navPag').jq.click()">
								<i class="pi pi-credit-card" /><span class="menu-label">Pagamentos</span>
							</button>
						</div>

						<div class="menu-section">
							<div class="menu-section-title">
								<span class="menu-label">Sistema</span>
							</div>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'users' ? 'active' : ''}"
								onclick="PF('navUsers').jq.click()">
								<i class="pi pi-user" /><span class="menu-label">Utilizadores</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'backups' ? 'active' : ''}"
								onclick="PF('navBackups').jq.click()">
								<i class="pi pi-database" /><span class="menu-label">Backups</span>
							</button>
						</div>

						<div class="menu-section">
							<div class="menu-section-title">
								<span class="menu-label">Configurações</span>
							</div>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'licencas' ? 'active' : ''}"
								onclick="PF('navLic').jq.click()">
								<i class="pi pi-key" /><span class="menu-label">Licenças</span><span
									class="menu-badge menu-label"
									style="background: rgba(59, 130, 246, .25); color: #93b4ff">#{licenseBean.licenses.size()}</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'escolas' ? 'active' : ''}"
								onclick="PF('navEscolas').jq.click()">
								<i class="pi pi-building" /><span class="menu-label">Escolas</span><span
									class="menu-badge menu-label">#{schoolBean.schools.size()}</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'ano' ? 'active' : ''}"
								onclick="PF('navAno').jq.click()">
								<i class="pi pi-calendar" /><span class="menu-label">Ano
									Académico</span><span class="menu-badge menu-label">#{academicYearBean.academicYears.size()}</span>
							</button>
							<button type="button"
								class="menu-item #{dashboardBean.activeMenu eq 'sms' ? 'active' : ''}"
								onclick="PF('navSms').jq.click()">
								<i class="pi pi-envelope" /><span class="menu-label">SMS
									/ Emails</span>
							</button>
						</div>

						<!-- NAVS ESCONDIDOS -->
						<p:commandButton id="btnDashboard" widgetVar="navDashboard"
							style="display:none"
							action="#{dashboardBean.navigate('welcome','dashboard')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cAlunos" widgetVar="navAlunos"
							style="display:none"
							action="#{dashboardBean.navigate('alunos/student-list','alunos')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cProf" widgetVar="navProf"
							style="display:none"
							action="#{dashboardBean.navigate('teachers/teacher-list','professores')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cTurmas" widgetVar="navTurmas"
							style="display:none"
							action="#{dashboardBean.navigate('classroom/classroom-list','turmas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cClasses" widgetVar="navClasses"
							style="display:none"
							action="#{dashboardBean.navigate('classes/class-list','classes')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cDisc" widgetVar="navDisc"
							style="display:none"
							action="#{dashboardBean.navigate('subjects/subject-list','disciplinas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cNotas" widgetVar="navNotas"
							style="display:none"
							action="#{dashboardBean.navigate('evaluation/grade-entry','notas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cPautas" widgetVar="navPautas"
							style="display:none"
							action="#{dashboardBean.navigate('evaluation/report-cards','pautas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cMens" widgetVar="navMens"
							style="display:none"
							action="#{dashboardBean.navigate('finance/fees-list','mensalidades')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cPag" widgetVar="navPag" style="display:none"
							action="#{dashboardBean.navigate('finance/payments-list','pagamentos')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cUsers" widgetVar="navUsers"
							style="display:none"
							action="#{dashboardBean.navigate('admin/users','users')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cBackups" widgetVar="navBackups"
							style="display:none"
							action="#{dashboardBean.navigate('admin/backups','backups')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cLic" widgetVar="navLic" style="display:none"
							action="#{dashboardBean.navigate('licenses/license-list','licencas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cEscolas" widgetVar="navEscolas"
							style="display:none"
							action="#{dashboardBean.navigate('schools/school-list','escolas')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cAno" widgetVar="navAno" style="display:none"
							action="#{dashboardBean.navigate('academic-year/academic-year-list','ano')}"
							update=":contentPanel :topbarInfo" />
						<p:commandButton id="cSms" widgetVar="navSms" style="display:none"
							action="#{dashboardBean.navigate('config/sms-email','sms')}"
							update=":contentPanel :topbarInfo" />
					</div>
				</h:form>

				<div class="sidebar-footer">
					<div class="sidebar-user">
						<div class="user-avatar">#{loginBean.fullname.substring(0,1)}</div>
						<div class="user-details" style="flex: 1; min-width: 0">
							<div
								style="font-size: 12px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#{loginBean.fullname}</div>
							<div
								style="font-size: 10.5px; color: rgba(255, 255, 255, .5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#{loginBean.role}
								· #{loginBean.loggedSchool.name}</div>
						</div>
					</div>
					<h:form>
						<p:commandButton value="Terminar sessão" icon="pi pi-sign-out"
							styleClass="logout-btn" action="#{loginBean.logout}" ajax="false" />
					</h:form>
				</div>
			</div>

			<div class="main">
				<div class="topbar">
					<h:panelGroup id="topbarInfo">
						<span style="font-size: 13px; font-weight: 600">#{dashboardBean.pageTitle}</span>
					</h:panelGroup>
				</div>
				<div class="content-area">
					<h:panelGroup id="contentPanel">
						<ui:include src="#{dashboardBean.currentPage}" />
					</h:panelGroup>
				</div>
			</div>
		</div>
		<script>
//<![CDATA[
function toggleSidebarUI(){document.getElementById('sidebar').classList.toggle('collapsed');}
//]]>
</script>
	</h:body>
</ui:composition>
