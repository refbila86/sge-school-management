<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core"
	xmlns:ui="jakarta.faces.facelets" xmlns:p="http://primefaces.org/ui">

	<h:head>
		<title>SGE - Sistema de Gestão Escolar</title>
		<h:outputStylesheet library="primefaces"
			name="primeicons/primeicons.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
			rel="stylesheet" />
	</h:head>

	<h:body
		style="margin:0;background:#f6f8fb;font-family:'Inter',sans-serif">

		<style>
:root {
	--primary: #0b1f3a;
	--primary-soft: #16305a;
	--primary-tint: #eef2f8;
	--accent: #3b6fd4;
	--bg: #f4f6fa;
	--card: #fff;
	--border: #e3e8f0;
	--muted: #6b7686;
	--ink: #101828;
	--radius-sm: 8px;
	--radius-md: 12px;
	--radius-lg: 16px
}

* {
	box-sizing: border-box
}

.app {
	display: flex;
	min-height: 100vh;
	color: var(--ink)
}

/* ---------- SIDEBAR ---------- */

.sidebar {
	width: 268px;
	background: var(--primary);
	color: rgba(255, 255, 255, .88);
	display: flex;
	flex-direction: column;
	transition: width .25s ease;
	position: sticky;
	top: 0;
	height: 100vh;
	overflow: hidden;
	z-index: 20;
	border-right: 1px solid rgba(255, 255, 255, .06)
}

.sidebar.collapsed {
	width: 76px
}

.brand {
	padding: 20px 18px;
	display: flex;
	align-items: center;
	gap: 11px;
	border-bottom: 1px solid rgba(255, 255, 255, .08);
	min-height: 68px
}

.brand-logo {
	width: 36px;
	height: 36px;
	background: white;
	border-radius: var(--radius-sm);
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--primary);
	font-weight: 800;
	font-size: 15px;
	flex-shrink: 0
}

.brand-text b {
	display: block;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: .2px;
	line-height: 1.2;
	color: #fff
}

.brand-text span {
	font-size: 10.5px;
	color: rgba(255, 255, 255, .5);
	letter-spacing: .2px
}

.sidebar.collapsed .brand-text, .sidebar.collapsed .menu-label, .sidebar.collapsed .menu-section,
	.sidebar.collapsed .menu-arrow, .sidebar.collapsed .menu-badge {
	display: none !important
}

.menu {
	flex: 1;
	overflow-y: auto;
	overflow-x: hidden;
	padding: 10px 10px 16px
}

.menu::-webkit-scrollbar {
	width: 4px
}

.menu::-webkit-scrollbar-thumb {
	background: rgba(255, 255, 255, .14);
	border-radius: 10px
}

.menu-section {
	font-size: 10.5px;
	letter-spacing: .3px;
	color: rgba(255, 255, 255, .38);
	margin: 20px 10px 8px;
	font-weight: 600
}

.menu-section:first-child {
	margin-top: 12px
}

.menu-item {
	width: 100%;
	display: flex;
	align-items: center;
	gap: 11px;
	padding: 9px 11px;
	border-radius: var(--radius-sm);
	color: rgba(255, 255, 255, .68);
	font-size: 13px;
	font-weight: 500;
	font-family: inherit;
	background: transparent;
	border: none;
	border-left: 2px solid transparent;
	cursor: pointer;
	text-align: left;
	transition: background .15s ease, color .15s ease;
	position: relative
}

.menu-item:hover {
	background: rgba(255, 255, 255, .06);
	color: #fff
}

.menu-item:focus-visible {
	outline: 2px solid rgba(255, 255, 255, .5);
	outline-offset: -2px
}

.menu-item.active {
	background: rgba(255, 255, 255, .1);
	color: #fff;
	font-weight: 600;
	border-left: 2px solid #fff
}

.menu-item.active i {
	color: #fff
}

.menu-item i {
	font-size: 14px;
	width: 18px;
	text-align: center;
	color: rgba(255, 255, 255, .55);
	transition: color .15s ease
}

.menu-badge {
	margin-left: auto;
	background: rgba(255, 255, 255, .12);
	color: rgba(255, 255, 255, .85);
	font-size: 10px;
	padding: 2px 7px;
	border-radius: 20px;
	font-weight: 600
}

.menu-item.active .menu-badge {
	background: rgba(255, 255, 255, .22);
	color: #fff
}

.menu-arrow {
	transition: transform .15s ease
}

.submenu {
	margin: 2px 0 6px 29px;
	border-left: 1px solid rgba(255, 255, 255, .1);
	padding-left: 12px;
	display: flex;
	flex-direction: column;
	gap: 1px
}

.submenu .menu-item {
	padding: 7px 10px;
	font-size: 12px;
	color: rgba(255, 255, 255, .58)
}

.sidebar.collapsed .submenu {
	display: none !important
}

.sidebar-footer {
	padding: 12px;
	border-top: 1px solid rgba(255, 255, 255, .08);
	display: flex;
	flex-direction: column;
	gap: 8px
}

.sidebar-user {
	display: flex;
	gap: 10px;
	align-items: center;
	padding: 8px;
	border-radius: var(--radius-sm)
}

.sidebar-user:hover {
	background: rgba(255, 255, 255, .05)
}

/* ---------- MAIN / TOPBAR ---------- */

.main {
	flex: 1;
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--bg)
}

.topbar {
	height: 64px;
	background: var(--card);
	border-bottom: 1px solid var(--border);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 24px;
	position: sticky;
	top: 0;
	z-index: 10
}

.topbar-left {
	display: flex;
	align-items: center;
	gap: 16px
}

.icon-btn {
	width: 36px;
	height: 36px;
	border-radius: var(--radius-sm);
	border: 1px solid var(--border);
	background: var(--card);
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	color: var(--muted);
	transition: background .15s ease, color .15s ease
}

.icon-btn:hover {
	background: var(--primary-tint);
	color: var(--primary)
}

.search {
	width: 300px;
	position: relative
}

.search input {
	width: 100%;
	height: 36px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: var(--radius-sm);
	padding: 0 12px 0 36px;
	font-size: 12.5px;
	outline: none;
	transition: border-color .15s ease
}

.search input:focus {
	border-color: var(--accent);
	background: #fff
}

.search i {
	position: absolute;
	left: 12px;
	top: 11px;
	color: var(--muted);
	font-size: 13px
}

.topbar-right {
	display: flex;
	align-items: center;
	gap: 12px
}

.avatar {
	width: 34px;
	height: 34px;
	border-radius: var(--radius-sm);
	background: var(--primary);
	color: white;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 600;
	font-size: 12.5px
}

.content-area {
	padding: 24px;
	flex: 1
}

@media ( max-width :900px) {
	.sidebar {
		position: fixed;
		left: -268px
	}
	.sidebar.open {
		left: 0
	}
	.search {
		display: none
	}
}
</style>

		<div class="app">
			<div
				class="sidebar #{dashboardBean.sidebarCollapsed ? 'collapsed' : ''}"
				id="sidebar">
				<div class="brand">
					<div class="brand-logo">S</div>
					<div class="brand-text">
						<b>SGE</b><span>Gestão Escolar v2.0</span>
					</div>
					<p:commandButton icon="pi pi-angle-left"
						style="margin-left:auto;background:rgba(255,255,255,.1);border:none;color:white;width:28px;height:28px;border-radius:8px"
						action="#{dashboardBean.toggleSidebar}" update="@none"
						oncomplete="document.getElementById('sidebar').classList.toggle('collapsed')"
						styleClass="menu-btn" />
				</div>

				<h:form id="menuForm" style="display:contents">
					<div class="menu">
						<button type="button"
							class="menu-item #{dashboardBean.isActive('dashboard') ? 'active' : ''}"
							onclick="PF('navigateDashboard').jq.click()">
							<i class="pi pi-home" /><span>Dashboard</span>
						</button>
						<p:commandButton id="btnDash" widgetVar="navigateDashboard"
							style="display:none"
							action="#{dashboardBean.navigate('welcome','dashboard')}"
							update=":contentPanel :topbarInfo" />

						<div class="menu-section">Académico</div>

						<button type="button"
							class="menu-item #{dashboardBean.isActive('alunos') ? 'active' : ''}"
							onclick="PF('navAlunos').jq.click()">
							<i class="pi pi-users" /><span>Alunos</span><span
								class="menu-badge">1.2k</span><i
								class="pi pi-angle-right menu-arrow"
								style="margin-left: auto; font-size: 10px; opacity: .5" />
						</button>
						<p:commandButton id="navAlunos" widgetVar="navAlunos"
							style="display:none"
							action="#{dashboardBean.navigate('alunos/list','alunos')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('turmas') ? 'active' : ''}"
							onclick="PF('navTurmas').jq.click()">
							<i class="pi pi-building" /><span>Turmas &amp; Salas</span>
						</button>
						<p:commandButton widgetVar="navTurmas" style="display:none"
							action="#{dashboardBean.navigate('turmas/list','turmas')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('professores') ? 'active' : ''}"
							onclick="PF('navProf').jq.click()">
							<i class="pi pi-briefcase" /><span>Professores</span><span
								class="menu-badge" style="background: rgba(16,185,129,.22); color:#6ee7b0">48</span>
						</button>
						<p:commandButton widgetVar="navProf" style="display:none"
							action="#{dashboardBean.navigate('professores/list','professores')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('disciplinas') ? 'active' : ''}"
							onclick="PF('navDisc').jq.click()">
							<i class="pi pi-book" /><span>Disciplinas</span>
						</button>
						<p:commandButton widgetVar="navDisc" style="display:none"
							action="#{dashboardBean.navigate('disciplinas/list','disciplinas')}"
							update=":contentPanel :topbarInfo" />

						<div class="menu-section">Avaliação &amp; Presença</div>

						<button type="button"
							class="menu-item #{dashboardBean.isActive('notas') ? 'active' : ''}"
							onclick="PF('navNotas').jq.click()">
							<i class="pi pi-file-edit" /><span>Notas &amp; Pautas</span>
						</button>
						<p:commandButton widgetVar="navNotas" style="display:none"
							action="#{dashboardBean.navigate('notas/list','notas')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('frequencia') ? 'active' : ''}"
							onclick="PF('navFreq').jq.click()">
							<i class="pi pi-calendar-check" /><span>Frequência</span>
						</button>
						<p:commandButton widgetVar="navFreq" style="display:none"
							action="#{dashboardBean.navigate('frequencia/list','frequencia')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('calendario') ? 'active' : ''}"
							onclick="PF('navCal').jq.click()">
							<i class="pi pi-calendar" /><span>Calendário Escolar</span>
						</button>
						<p:commandButton widgetVar="navCal" style="display:none"
							action="#{dashboardBean.navigate('calendario/index','calendario')}"
							update=":contentPanel :topbarInfo" />

						<div class="menu-section">Gestão</div>

						<button type="button"
							class="menu-item #{dashboardBean.isActive('financeiro') ? 'active' : ''}"
							onclick="PF('navFin').jq.click()">
							<i class="pi pi-wallet" /><span>Financeiro</span><span
								class="menu-badge" style="background: rgba(245,158,11,.2); color:#fcd34d">Propinas</span>
						</button>
						<p:commandButton widgetVar="navFin" style="display:none"
							action="#{dashboardBean.navigate('financeiro/index','financeiro')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('biblioteca') ? 'active' : ''}"
							onclick="PF('navBib').jq.click()">
							<i class="pi pi-bookmark" /><span>Biblioteca</span>
						</button>
						<p:commandButton widgetVar="navBib" style="display:none"
							action="#{dashboardBean.navigate('biblioteca/index','biblioteca')}"
							update=":contentPanel :topbarInfo" />

						<button type="button"
							class="menu-item #{dashboardBean.isActive('relatorios') ? 'active' : ''}"
							onclick="PF('navRel').jq.click()">
							<i class="pi pi-chart-bar" /><span>Relatórios</span>
						</button>
						<p:commandButton widgetVar="navRel" style="display:none"
							action="#{dashboardBean.navigate('relatorios/index','relatorios')}"
							update=":contentPanel :topbarInfo" />

						<div class="menu-section">Sistema</div>

						<!-- MENU ESCOLAS - NOVO -->
						<button type="button"
							class="menu-item #{dashboardBean.isActive('escolas') ? 'active' : ''}"
							onclick="PF('navEscolas').jq.click()">
							<i class="pi pi-building" /><span>Escolas</span> <span
								class="menu-badge" style="background: rgba(255,255,255,.16)">#{schoolBean.schools.size()}</span>
						</button>
						<p:commandButton widgetVar="navEscolas" style="display:none"
							action="#{dashboardBean.navigate('schools/school-list','escolas')}"
							update=":contentPanel :topbarInfo" />

						<!-- SUBMENU CONFIGURAÇÕES -->
						<button type="button"
							class="menu-item #{dashboardBean.isActive('config') or dashboardBean.isActive('escolas') ? 'active' : ''}"
							onclick="document.getElementById('submenu-config').classList.toggle('hidden'); this.querySelector('.menu-arrow').classList.toggle('pi-angle-down');">
							<i class="pi pi-cog" /><span>Configurações</span> <i
								class="pi pi-angle-right menu-arrow"
								style="margin-left: auto; font-size: 10px; opacity: .5; transition: .2s" />
						</button>

						<div id="submenu-config"
							class="submenu #{dashboardBean.isActive('escolas') or dashboardBean.isActive('config') or dashboardBean.isActive('users') ? '' : 'hidden'}"
							style="display: #{dashboardBean.isActive('escolas') or dashboardBean.isActive('config') or dashboardBean.isActive('users') ? 'flex' : 'none'}">

							<button type="button"
								class="menu-item #{dashboardBean.isActive('escolas') ? 'active' : ''}"
								onclick="PF('navEscolasSub').jq.click()">
								<i class="pi pi-building" style="font-size: 12px" /><span>Cadastro
									de Escolas</span>
							</button>
							<p:commandButton widgetVar="navEscolasSub" style="display:none"
								action="#{dashboardBean.navigate('escolas/school-list','escolas')}"
								update=":contentPanel :topbarInfo" />

							<button type="button" class="menu-item"
								onclick="PF('navEscolaNova').jq.click()">
								<i class="pi pi-plus" style="font-size: 12px" /><span>Nova
									Escola</span>
							</button>
							<p:commandButton widgetVar="navEscolaNova" style="display:none"
								action="#{dashboardBean.navigate('escolas/school-include','escolas')}"
								update=":contentPanel :topbarInfo" />

							<button type="button"
								class="menu-item #{dashboardBean.isActive('users') ? 'active' : ''}"
								onclick="PF('navUsers').jq.click()">
								<i class="pi pi-users" style="font-size: 12px" /><span>Utilizadores</span>
							</button>
							<p:commandButton widgetVar="navUsers" style="display:none"
								action="#{dashboardBean.navigate('admin/users','users')}"
								update=":contentPanel :topbarInfo" />

							<button type="button"
								class="menu-item #{dashboardBean.isActive('config') ? 'active' : ''}"
								onclick="PF('navConfig').jq.click()">
								<i class="pi pi-sliders-h" style="font-size: 12px" /><span>Parâmetros
									Gerais</span>
							</button>
							<p:commandButton widgetVar="navConfig" style="display:none"
								action="#{dashboardBean.navigate('admin/config','config')}"
								update=":contentPanel :topbarInfo" />
						</div>

					</div>
				</h:form>

				<div class="sidebar-footer">
					<div class="sidebar-user">
						<div class="avatar"
							style="width: 32px; height: 32px; background: rgba(255,255,255,.12); color: #fff; flex-shrink:0">#{loginBean.fullname.substring(0,1)}</div>
						<div style="flex: 1; min-width: 0" class="menu-label">
							<div
								style="font-size: 12px; font-weight: 600; color:#fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#{loginBean.fullname}</div>
							<div style="font-size: 10.5px; color: rgba(255,255,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#{loginBean.role}
								· #{loginBean.loggedSchool.name}</div>
						</div>
					</div>
					<h:form class="menu-label">
						<p:commandButton value="Terminar sessão" icon="pi pi-sign-out"
							style="width:100%;background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.7);border-radius:8px;font-size:11.5px;font-weight:500"
							action="#{loginBean.logout}" ajax="false" />
					</h:form>
				</div>
			</div>

			<div class="main">
				<div class="topbar">
					<div class="topbar-left">
						<button class="icon-btn"
							onclick="document.getElementById('sidebar').classList.toggle('open')">
							<i class="pi pi-bars" />
						</button>
						<div class="search">
							<i class="pi pi-search" /><input
								placeholder="Pesquisar alunos, turmas, professores..." />
						</div>
					</div>
					<div class="topbar-right">
						<h:panelGroup id="topbarInfo"
							style="display:flex;align-items:center;gap:14px">
							<span style="font-size: 11px; color: var(--muted)"><i
								class="pi pi-clock" style="margin-right: 4px" /> <h:outputText
									value="#{now}">
									<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
								</h:outputText></span>
							<p:commandButton icon="pi pi-bell" styleClass="icon-btn"
								style="width:40px;height:40px;border-radius:12px;background:#f1f5f9;border:1px solid var(--border);color:var(--muted)" />
							<div class="avatar">#{loginBean.fullname.substring(0,1)}</div>
						</h:panelGroup>
					</div>
				</div>

				<div class="content-area">
					<h:panelGroup id="contentPanel">
						<ui:include src="#{dashboardBean.currentPage}" />
					</h:panelGroup>
				</div>
			</div>
		</div>
	</h:body>
</ui:composition>
