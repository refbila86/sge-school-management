<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	<h:body
		style="margin:0;background:#f6f8fb;font-family:'Inter',sans-serif">

		<style>
:root {
	--primary: #0b1f3a;
	--primary-soft: #16305a;
	--primary-tint: #eef2f8;
	--accent: #3b6fd4;
	--bg: #f4f6fa;
	--card: #fff;
	--border: #e3e8f0;
	--muted: #6b7686;
	--ink: #101828;
	--radius-sm: 8px;
	--radius-md: 12px;
	--radius-lg: 16px
}

* {
	box-sizing: border-box
}

.app {
	display: flex;
	min-height: 100vh;
	color: var(--ink)
}

/* ---------- SIDEBAR ---------- */
.sidebar {
	width: 268px;
	background: var(--primary);
	color: rgba(255, 255, 255, .88);
	display: flex;
	flex-direction: column;
	transition: width .25s ease;
	position: sticky;
	top: 0;
	height: 100vh;
	overflow: hidden;
	z-index: 20;
	border-right: 1px solid rgba(255, 255, 255, .06)
}

.sidebar.collapsed {
	width: 76px
}

.brand {
	padding: 20px 18px;
	display: flex;
	align-items: center;
	gap: 11px;
	border-bottom: 1px solid rgba(255, 255, 255, .08);
	min-height: 68px
}

.brand-logo {
	width: 36px;
	height: 36px;
	background: white;
	border-radius: var(--radius-sm);
	display: flex;
	align-items: center;
	justify-content: center;
	color: var(--primary);
	font-weight: 800;
	font-size: 15px;
	flex-shrink: 0
}

.brand-text b {
	display: block;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: .2px;
	line-height: 1.2;
	color: #fff
}

.brand-text span {
	font-size: 10.5px;
	color: rgba(255, 255, 255, .5);
	letter-spacing: .2px
}

.sidebar.collapsed .brand-text, .sidebar.collapsed .menu-label, .sidebar.collapsed .menu-section,
	.sidebar.collapsed .menu-arrow, .sidebar.collapsed .menu-badge {
	display: none !important
}

.menu {
	flex: 1;
	overflow-y: auto;
	overflow-x: hidden;
	padding: 10px 10px 16px
}

.menu::-webkit-scrollbar {
	width: 4px
}

.menu::-webkit-scrollbar-thumb {
	background: rgba(255, 255, 255, .14);
	border-radius: 10px
}

.menu-section {
	font-size: 10.5px;
	letter-spacing: .3px;
	color: rgba(255, 255, 255, .38);
	margin: 20px 10px 8px;
	font-weight: 600
}

.menu-item {
	width: 100%;
	display: flex;
	align-items: center;
	gap: 11px;
	padding: 9px 11px;
	border-radius: var(--radius-sm);
	color: rgba(255, 255, 255, .68);
	font-size: 13px;
	font-weight: 500;
	font-family: inherit;
	background: transparent;
	border: none;
	border-left: 2px solid transparent;
	cursor: pointer;
	text-align: left;
	transition: background .15s ease, color .15s ease;
	position: relative
}

.menu-item:hover {
	background: rgba(255, 255, 255, .06);
	color: #fff
}

.menu-item:focus-visible {
	outline: 2px solid rgba(255, 255, 255, .5);
	outline-offset: -2px
}

.menu-item.active {
	background: rgba(255, 255, 255, .1);
	color: #fff;
	font-weight: 600;
	border-left: 2px solid #fff
}

.menu-item.active i {
	color: #fff
}

.menu-item i {
	font-size: 14px;
	width: 18px;
	text-align: center;
	color: rgba(255, 255, 255, .55);
	transition: color .15s ease
}

.menu-badge {
	margin-left: auto;
	background: rgba(255, 255, 255, .12);
	color: rgba(255, 255, 255, .85);
	font-size: 10px;
	padding: 2px 7px;
	border-radius: 20px;
	font-weight: 600
}

.menu-item.active .menu-badge {
	background: rgba(255, 255, 255, .22);
	color: #fff
}

.menu-arrow {
	margin-left: auto;
	font-size: 10px !important;
	opacity: .5;
	transition: transform .2s ease
}

.menu-arrow.open {
	transform: rotate(90deg)
}

/* Botão "Recolher submenus" */
.menu-collapse-all {
	font-size: 11.5px;
	padding: 7px 11px;
	margin-bottom: 4px;
	color: rgba(255, 255, 255, .5);
	border: 1px dashed rgba(255, 255, 255, .14);
	border-left: 1px dashed rgba(255, 255, 255, .14)
}

.menu-collapse-all i {
	font-size: 12px
}

.submenu {
	margin: 2px 0 6px 29px;
	border-left: 1px solid rgba(255, 255, 255, .1);
	padding-left: 12px;
	display: none;
	flex-direction: column;
	gap: 1px
}

.submenu .menu-item {
	padding: 7px 10px;
	font-size: 12px;
	color: rgba(255, 255, 255, .58)
}

.sidebar.collapsed .submenu {
	display: none !important
}

.sidebar-footer {
	padding: 12px;
	border-top: 1px solid rgba(255, 255, 255, .08);
	display: flex;
	flex-direction: column;
	gap: 8px
}

.sidebar-user {
	display: flex;
	gap: 10px;
	align-items: center;
	padding: 8px;
	border-radius: var(--radius-sm)
}

.sidebar-user:hover {
	background: rgba(255, 255, 255, .05)
}

/* ---------- MAIN / TOPBAR ---------- */
.main {
	flex: 1;
	display: flex;
	flex-direction: column;
	min-width: 0;
	background: var(--bg)
}

.topbar {
	height: 64px;
	background: var(--card);
	border-bottom: 1px solid var(--border);
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0 24px;
	position: sticky;
	top: 0;
	z-index: 10
}

.topbar-left {
	display: flex;
	align-items: center;
	gap: 16px
}

.icon-btn {
	width: 36px;
	height: 36px;
	border-radius: var(--radius-sm);
	border: 1px solid var(--border);
	background: var(--card);
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	color: var(--muted);
	transition: background .15s ease, color .15s ease
}

.icon-btn:hover {
	background: var(--primary-tint);
	color: var(--primary)
}

.search {
	width: 300px;
	position: relative
}

.search input {
	width: 100%;
	height: 36px;
	background: var(--bg);
	border: 1px solid var(--border);
	border-radius: var(--radius-sm);
	padding: 0 12px 0 36px;
	font-size: 12.5px;
	outline: none;
	transition: border-color .15s ease
}

.search input:focus {
	border-color: var(--accent);
	background: #fff
}

.search i {
	position: absolute;
	left: 12px;
	top: 11px;
	color: var(--muted);
	font-size: 13px
}

.topbar-right {
	display: flex;
	align-items: center;
	gap: 12px
}

.avatar {
	width: 34px;
	height: 34px;
	border-radius: var(--radius-sm);
	background: var(--primary);
	color: white;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 600;
	font-size: 12.5px
}

.content-area {
	padding: 24px;
	flex: 1
}

@media ( max-width :900px) {
	.sidebar {
		position: fixed;
		left: -268px
	}
	.sidebar.open {
		left: 0
	}
	.search {
		display: none
	}
}
</style>

		<script>
//<![CDATA[
/* Abre/fecha um submenu e roda a seta do botão que o controla */
function toggleSubmenu(btn, submenuId) {
	var sub = document.getElementById(submenuId);
	var arrow = btn.querySelector('.menu-arrow');
	var isOpen = sub.style.display === 'flex';
	sub.style.display = isOpen ? 'none' : 'flex';
	if (arrow) {
		if (isOpen) { arrow.classList.remove('open'); }
		else { arrow.classList.add('open'); }
	}
}

/* Recolhe todos os submenus do menu principal */
function collapseAllSubmenus() {
	var subs = document.querySelectorAll('#sidebar .submenu');
	for (var i = 0; i < subs.length; i++) {
		subs[i].style.display = 'none';
	}
	var arrows = document.querySelectorAll('#sidebar .menu-arrow.open');
	for (var j = 0; j < arrows.length; j++) {
		arrows[j].classList.remove('open');
	}
}
//]]>
</script>
